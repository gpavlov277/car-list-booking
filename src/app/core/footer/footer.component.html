<footer class="text-center text-white bg-body-tertiary footer-pos">
  <!-- Grid container -->
  <div class="container pt-2">
    <!-- Section: Social media -->
    <section class="mb-2">
      <!-- Facebook -->
      <a
        class="btn btn-link btn-floating btn-lg text-dark m-1"
        href="#!"
        role="button"
        data-mdb-ripple-color="dark"
      >
        <fa-icon [icon]="faFacebook"></fa-icon
      ></a>

      <!-- Twitter -->
      <a
        class="btn btn-link btn-floating btn-lg text-dark m-1"
        href="#!"
        role="button"
        data-mdb-ripple-color="dark"
        ><fa-icon [icon]="faTwitter"></fa-icon
      ></a>

      <!-- Instagram -->
      <a
        class="btn btn-link btn-floating btn-lg text-dark m-1"
        href="#!"
        role="button"
        data-mdb-ripple-color="dark"
        ><fa-icon [icon]="faInstagram"></fa-icon
      ></a>

      <!-- Linkedin -->
      <a
        class="btn btn-link btn-floating btn-lg text-dark m-1"
        href="#!"
        role="button"
        data-mdb-ripple-color="dark"
        ><fa-icon [icon]="faLinkedin"></fa-icon
      ></a>
    </section>
    <!-- Section: Social media -->
  </div>
  <!-- Grid container -->

  <!-- Copyright -->
  <div
    class="text-center text-dark p-3 bg-secondary.bg-gradient"
    style="background-color: rgba(0, 0, 0, 0.2)"
  >
    © 2023 Copyright:
    <a class="text-dark" href="http://localhost:4200/home">GPBooking.com</a>
  </div>

</footer>
