<div class="container-xl">
  <div class="table-responsive">
    <!-- <form class="d-flex mb-4 mt-2 p-2" role="search"> -->
    <div class="container mb-4 d-flex justify-content-center">
      <div class="row">
        <div class="col-lg-9 d-flex justify-content-center">
          <input class="form-control mt-3" type="search" placeholder="Search" aria-label="Search" #searchKey />

        </div>
        <div class="col-lg-3 d-flex justify-content-center">
          <button class=" btn btn-outline-primary search-btn mt-3" (click)="onSearch(searchKey)">
            Search
          </button>
        </div>
      </div>
    </div>

    <!-- </form> -->

    <div class="table-wrapper">
      <div class="table-title">
        <div class="row">
          <div class="col-sm-5">
            <h2 *ngIf="allCars.length>0">All <b>Vehicles</b></h2>
            <h2 *ngIf="allCars.length<=0">No <b>Vehicles Found</b></h2>
          </div>
          <div class="col-sm-7">
            <a routerLink="/add-vehicle" class="btn btn-secondary">
              <span>Add New Vehicle</span></a>
          </div>
        </div>
      </div>
      <div *ngIf="isLoading" class="container-fluid d-flex justify-content-center w-100 mt-3">
        <div class="row">
          <app-loader></app-loader>
        </div>
      </div>
      <table *ngIf="!isLoading" class="table table-striped table-hover">
        <thead>
          <tr>
            <th></th>
            <th class="text-center"></th>
            <th>Date Created</th>
            <th>Location</th>
            <!-- <th>Status</th> -->
            <th>Action</th>
          </tr>


        </thead>

        <tbody>
          <tr *ngFor="let car of allCars">


            <td *ngIf="!likedCars.includes(car._id)">
              <span *ngIf="userId" (click)="onLike(car._id)" class="heart-normal"><fa-icon
                  [icon]="faHeart"></fa-icon></span>
              <span *ngIf="!userId" routerLink="/login" class="heart-normal"><fa-icon [icon]="faHeart"></fa-icon></span>
            </td>

            <td *ngIf="likedCars.includes(car._id)">
              <span (click)="onDislike(car._id)" class="heart-liked"><fa-icon [icon]="faHeart"></fa-icon></span>
            </td>
            <td>

              <a routerLink="/details-vehicle/{{car._id}}"><img [src]="car.image" class="avatar" alt="IMG" />
                {{car.make}} {{car.model}}</a>
            </td>
            <td>{{car.created_at.slice(0,10)}}</td>
            <td>{{car.location}}</td>
            <!-- <td><span class="status text-success">&bull;</span> Active</td> -->
            <td>
              <a routerLink="/edit-vehicle/{{car._id}}" class="settings" title="Edit" type="button"
                data-toggle="tooltip"><fa-icon [icon]="faEdit"></fa-icon></a>


              <a *ngIf="userId" class="delete" title="Delete" data-toggle="tooltip" type="button" data-bs-toggle="modal"
                #deleteBtn data-bs-target="#confirmModal"><fa-icon [icon]="faTrash"
                  (click)="getId(car._id,deleteBtn)"></fa-icon></a>
              <a *ngIf="!userId" routerLink="/login" class="delete" title="Delete" type="button" #deleteBtn><fa-icon
                  [icon]="faTrash"></fa-icon></a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-confirm-modal [vehicleIdItem]="vehicleId" (deleteEvent)="onDelete($event)"></app-confirm-modal>
