<div class="container-xl">
  <div class="table-responsive">
    <div class="table-wrapper">
      <div class="table-title">
        <div class="row">
          <div class="col-sm-5">
            <h2>My <b>Favoutite Vehicles</b></h2>
          </div>
        </div>
      </div>
      <table class="table table-striped table-hover mt-5">
        <tbody>
          <tr *ngFor="let fav of favourites">
            <td>
              <a routerLink="/details-vehicle/{{fav._id}}"><img src={{fav.image}} class="avatar"
                  alt="CarImage" />{{fav.make}} {{fav.model}}
              </a>
            </td>

            <td><button class="btn btn-danger" (click)="removeFromFav(fav._id)">Remove</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
