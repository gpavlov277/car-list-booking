<div class="container-xl mb-5 mt-5">
  <div class="table-wrapper">
    <div class="table-title">
      <div class="col-sm-5">
        <h2>Edit <b>Vehicle</b></h2>
      </div>
    </div>

    <div *ngIf="isLoading" class="container-fluid d-flex justify-content-center w-100 mt-3">
      <div class="row">
        <app-loader></app-loader>
      </div>
    </div>

    <div class="container gradient-custom mt-5">
      <div class="row justify-content-center mt-4 mb-4">



        <form #editForm="ngForm" class="w-75" *ngIf="!isLoading" (ngSubmit)="updateVehicle(editForm)">
          <div class="form-group">
            <label for="car-make">Make</label>
            <input type="text" class="form-control" name="car-make" ngModel="{{vehicle?.make}}" />
          </div>

          <div class="form-group">
            <label for="car-model">Model</label>
            <input type="text" class="form-control" name="car-model" ngModel="{{vehicle?.model}}" />
          </div>

          <div class="form-group">
            <label for="car-power">Horsepower</label>
            <input type="text" class="form-control" name="car-power" ngModel="{{vehicle?.horsepower}}" />
          </div>

          <div class="form-group">
            <label for="car-color">Color</label>
            <input type="text" class="form-control" name="car-color" ngModel="{{vehicle?.color}}" />
          </div>

          <div class="form-group">
            <label for="car-year">Year</label>
            <input type="text" class="form-control" name="car-year" ngModel="{{vehicle?.year}}" />
          </div>

          <div class="form-group">
            <label for="car-year">Location</label>
            <input type="text" class="form-control" name="car-location" ngModel="{{vehicle?.location}}" />
          </div>

          <div class="form-group">
            <p>Image</p>
            <input type="file" class="form-control-file" name="car-image" accept="image/*" (change)="onUpload($event)"
              #image="ngModel" ngModel />
          </div>
          <div class="form-group" *ngIf="!selectedImage">
            <img src={{vehicle?.image}} class="img-thumbnail img-preview mt-2 mb-2">
          </div>
          <div class="form-group" *ngIf="selectedImage">
            <img [src]="selectedImage" class="img-thumbnail img-preview mt-2 mb-2">

          </div>
          <div class="container">
            <div class="row">
              <div class="col-lg-6 col-md-6 col-sm-6 d-flex justify-content-start">
                <button type="submit" class="btn btn-primary mt-3">Submit</button>
                <a routerLink="/" class="btn btn-danger mt-3 close-btn">Close</a>
              </div>

            </div>
          </div>

        </form>


      </div>
    </div>
  </div>
</div>
