<form #form="ngForm" (ngSubmit)="login(form)">
  <section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <div class="card bg-dark text-white" style="border-radius: 1rem">
            <div class="card-body p-5 text-center">
              <div class="mb-md-5 mt-md-4">
                <h2 class="fw-bold mb-3 text-uppercase">Login</h2>

                <div class="form-outline form-white mb-4">
                  <input type="email" name="email" id="typeEmailX" placeholder="Email" [appEmail]="[]"
                    #inputEmail="ngModel" ngModel required class="form-control form-control-lg" />

                  <ng-container *ngIf="inputEmail.touched">
                    <div class="errors-container">
                      <p class="validation-error" *ngIf="inputEmail.errors?.['required']">Email address is required!</p>
                      <p class="validation-error" *ngIf="inputEmail.errors?.['appEmailValidator']">Email address is not
                        valid!</p>
                    </div>
                  </ng-container>

                </div>


                <div class="form-outline form-white mb-4">
                  <input type="password" id="typePasswordX" name="password" placeholder="Password"
                    #inputPassword="ngModel" minlength="5" ngModel required class=" form-control form-control-lg" />

                  <ng-container *ngIf="inputPassword.touched">
                    <p class="validation-error" *ngIf="inputPassword.errors?.['required']">Password is required!</p>
                    <p class="validation-error" *ngIf="inputPassword.errors?.['minlength']">Password must be at least 5
                      characters!</p>
                  </ng-container>
                </div>


                <button class="btn btn-outline-light btn-lg px-5 mb-4" type="submit">
                  Login
                </button>
              </div>

              <div>
                <p class="mb-0">
                  Don't have an account?
                  <a routerLink="/register" class="text-white-50 fw-bold">Sign Up</a>
                </p>
              </div>
              <div>
                <p class="mb-0">
                  Continue as a guest
                  <a routerLink="/home" class="text-white-50 fw-bold"><fa-icon [icon]="faSignIn"></fa-icon></a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</form>
